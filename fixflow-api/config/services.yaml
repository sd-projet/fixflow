parameters:
  # Derrière un proxy (Render, Vercel…), Symfony doit faire confiance à X-Forwarded-Proto pour savoir qu'on est en HTTPS.
  env(TRUSTED_PROXIES): '127.0.0.1'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/User/User.php'
      - '../src/Ticket/{Ticket,TicketHistory,Attachment,TicketStatus,Priority,Category}.php'
      - '../src/Comment/Comment.php'
      - '../src/Notification/{Notification,TicketEvent}.php'
