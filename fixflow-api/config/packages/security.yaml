security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_users:
      entity: { class: App\User\User, property: email }
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_users
      user_checker: App\Security\ActiveUserChecker
      json_login:
        check_path: api_login
        username_path: email
        password_path: password
      logout:
        path: api_logout
  access_control:
    - { path: ^/api/(login|docs|contexts), roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      # Hachage rapide uniquement pour les tests
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
