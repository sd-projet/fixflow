doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    profiling_collect_backtrace: '%kernel.debug%'

  orm:
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: false
    controller_resolver:
      auto_mapping: false
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src'
        prefix: 'App'
        alias: App

when@test:
  doctrine:
    dbal:
      # Les tests utilisent une base dédiée (fixflow_test).
      dbname_suffix: '_test'