doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    server_version: '16'
    profiling_collect_backtrace: '%kernel.debug%'
  orm:
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: false
    controller_resolver:
      auto_mapping: true
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src'
        prefix: 'App'
        alias: App

when@test:
  doctrine:
    dbal:
      # Les tests vident le schéma : ils travaillent sur une base dédiée (fixflow_test), jamais sur celle de dev.
      dbname_suffix: '_test'
