
nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['https://fixflow-black.vercel.app']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization', 'Accept', 'Origin', 'X-Requested-With']
        expose_headers: []
        max_age: 3600
    paths:
        '^/api/':
            allow_origin: ['https://fixflow-black.vercel.app']
            allow_headers: ['Content-Type', 'Authorization', 'Accept', 'Origin', 'X-Requested-With']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            max_age: 3600
