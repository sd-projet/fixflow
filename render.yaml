# Blueprint Render : crée la base PostgreSQL et le service API.
# Render → New → Blueprint → choisir le dépôt. Le frontend se déploie séparément sur Vercel.
databases:
  - name: fixflow-db
    databaseName: fixflow
    user: fixflow
    plan: free

services:
  - type: web
    name: fixflow-api
    runtime: docker
    dockerfilePath: ./fixflow-api/Dockerfile.prod
    dockerContext: ./fixflow-api
    plan: free
    healthCheckPath: /api/contexts/Entrypoint
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fixflow-db
          property: connectionString
      # Pas de worker gratuit sur Render : les notifications sont traitées de façon synchrone.
      - key: MESSENGER_TRANSPORT_DSN
        value: sync://
      # Fait confiance au proxy de Render pour détecter le HTTPS (cookies « secure »).
      - key: TRUSTED_PROXIES
        value: REMOTE_ADDR
      # Premier compte administrateur (créé au démarrage s'il n'existe pas). À renseigner dans le tableau de bord Render.
      - key: FIXFLOW_ADMIN_EMAIL
        sync: false
      - key: FIXFLOW_ADMIN_PASSWORD
        sync: false
      # 1 = crée aussi les comptes et incidents de démonstration (mot de passe public « password »). Mettre 0 pour un usage réel.
      - key: FIXFLOW_SEED
        value: "1"
